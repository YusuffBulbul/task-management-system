services:
  mongodb:
    image: mongo:8.0
    container_name: task-management-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    command:
      - mongod
      - --bind_ip_all
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: [ "CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 2)" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - task-management-network

  kafka:
    image: apache/kafka:4.1.1
    container_name: task-management-kafka
    restart: unless-stopped
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: >-
        CONTROLLER://:9093,
        PLAINTEXT://:29092,
        PLAINTEXT_HOST://:19092

      KAFKA_ADVERTISED_LISTENERS: >-
        PLAINTEXT://kafka:29092,
        PLAINTEXT_HOST://${KAFKA_HOST:-localhost}:19092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,
        PLAINTEXT:PLAINTEXT,
        PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - task-management-network

  kafka-init:
    image: apache/kafka:4.1.1
    container_name: task-management-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic task-events \
          --partitions 3 \
          --replication-factor 1

        /opt/kafka/bin/kafka-topics.sh \
          --bootstrap-server kafka:29092 \
          --create \
          --if-not-exists \
          --topic notification-events \
          --partitions 3 \
          --replication-factor 1

        echo "Kafka topics are ready."
    networks:
      - task-management-network

  task-service:
    image: localhost/task-service:local
    build:
      context: ./task-service
      dockerfile: Containerfile
    container_name: task-service-container
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8081:8081"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/taskdb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8081
    networks:
      - task-management-network

  notification-service:
    image: localhost/notification-service:local
    build:
      context: ./notification-service
      dockerfile: Containerfile
    container_name: notification-service-container
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8082
    networks:
      - task-management-network

  analytics-service:
    image: localhost/analytics-service:local
    build:
      context: ./analytics-service
      dockerfile: Containerfile
    container_name: analytics-service-container
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8083:8083"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/analyticsdb
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SERVER_PORT: 8083
    networks:
      - task-management-network

  api-gateway:
    image: localhost/api-gateway:local
    build:
      context: ./api-gateway
      dockerfile: Containerfile
    container_name: api-gateway-container
    restart: unless-stopped
    depends_on:
      - task-service
      - analytics-service
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      TASK_SERVICE_URL: http://task-service-container:8081
      ANALYTICS_SERVICE_URL: http://analytics-service-container:8083
    networks:
      - task-management-network

  frontend:
    image: localhost/frontend:local
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: frontend-container
    restart: unless-stopped
    depends_on:
      - api-gateway
    ports:
      - "5173:8080"
    networks:
      - task-management-network

volumes:
  mongodb-data:
  kafka-data:

networks:
  task-management-network:
    driver: bridge