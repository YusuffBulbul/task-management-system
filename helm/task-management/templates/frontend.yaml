{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.frontend.deployment.name }}
  labels:
    app: {{ .Values.frontend.deployment.name }}
    app.kubernetes.io/name: {{ .Values.frontend.deployment.name }}
    app.kubernetes.io/component: frontend
    {{- include "task-management.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.deployment.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.frontend.deployment.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.frontend.deployment.name }}
        app.kubernetes.io/name: {{ .Values.frontend.deployment.name }}
        app.kubernetes.io/component: frontend
        {{- include "task-management.labels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.global.imageNamespace }}/{{ .Values.frontend.image.repository }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}

          ports:
            - name: http
              containerPort: {{ .Values.frontend.service.port }}
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.probes.frontend.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.frontend.readiness.periodSeconds }}
            failureThreshold: {{ .Values.probes.frontend.readiness.failureThreshold }}

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.probes.frontend.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.frontend.liveness.periodSeconds }}
            failureThreshold: {{ .Values.probes.frontend.liveness.failureThreshold }}

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.frontend.service.name }}
  labels:
    app: {{ .Values.frontend.deployment.name }}
    app.kubernetes.io/name: {{ .Values.frontend.deployment.name }}
    app.kubernetes.io/component: frontend
    {{- include "task-management.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ .Values.frontend.deployment.name }}
  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
  type: ClusterIP

  {{- if .Values.route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ .Values.route.name }}
  labels:
    app: {{ .Values.frontend.deployment.name }}
    app.kubernetes.io/name: {{ .Values.frontend.deployment.name }}
    app.kubernetes.io/component: frontend
    {{- include "task-management.labels" . | nindent 4 }}
spec:
  to:
    kind: Service
    name: {{ .Values.frontend.service.name }}
    weight: 100
  port:
    targetPort: http
  tls:
    termination: {{ .Values.route.tlsTermination }}
    insecureEdgeTerminationPolicy: {{ .Values.route.insecureEdgeTerminationPolicy }}
  wildcardPolicy: None
  {{- end }}
  {{- end }}